<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTS - Beyond The Scene</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuentes de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Encabezado / Hero -->
  <header class="hero">
    <div class="hero-content">
      <span class="badge">K-POP LEGENDS</span>
      <h1>BTS (방탄소년단)</h1>
      <p>Beyond The Scene • Conectando al mundo a través de la música</p>
    </div>
  </header>

  <main class="container">
    <!-- Sección de Información / Frases -->
    <section class="quote-box">
      <p id="quote-text">"I have come to love myself for who I am, for who I was, and for who I hope to become."</p>
      <span id="quote-author">- RM (Kim Nam-joon)</span>
      <button id="btn-quote">Generar otra frase 💜</button>
    </section>

    <!-- Sección de Integrantes -->
    <section class="members-section">
      <h2>Conoce a los Integrantes</h2>
      <div class="grid-members" id="members-container">
        <!-- Las tarjetas se generan dinámicamente con JavaScript -->
      </div>
    </section>
  </main>

  <footer>
    <p>Hecho con 💜 para ARMY | HTML, CSS & JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
